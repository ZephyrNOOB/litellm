name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
      - litellm_internal_staging
    paths:
      - "litellm/**"
      - "litellm-rust/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
  pull_request:
    branches:
      - main
      - litellm_internal_staging
    paths:
      - "litellm/**"
      - "litellm-rust/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
  # Allow CodSpeed to trigger backtest performance analysis
  # in order to generate initial data
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed
      id-token: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e2f660a12afa426885c7a92b1b8834b297505bce # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      # Build the wheel and resolve every dependency outside the CodSpeed
      # runner: the same maturin build took 42 minutes inside `codspeed run`
      # versus under 3 minutes as a plain step (LIT-6183)
      - name: Build environment
        run: >
          env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          uv run --frozen --no-default-groups
          --with pytest==8.3.5
          --with pytest-codspeed==4.3.0
          --with "mcp>=2.2.0,<3.0"
          --with "a2a-sdk>=1.1.0,<2.0"
          pytest
          -p pytest_codspeed.plugin
          tests/benchmarks/
          --codspeed
          --collect-only -q

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          token: fc588754-1545-4b3d-aab3-10e6b76f70d8
          run: >
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-default-groups
            --with pytest==8.3.5
            --with pytest-codspeed==4.3.0
            --with "mcp>=2.2.0,<3.0"
            --with "a2a-sdk>=1.1.0,<2.0"
            pytest
            -p pytest_codspeed.plugin
            tests/benchmarks/
            --codspeed

  rust-benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed
      id-token: write
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # litellm-python-bridge's serialization benchmark embeds CPython through
      # pyo3, so the benchmark binary needs an interpreter to build against.
      - name: Set up Python
        uses: actions/setup-python@e2f660a12afa426885c7a92b1b8834b297505bce # v6
        with:
          python-version: "3.12"

      - run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-codspeed@5.0.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: litellm-rust
          cache-on-failure: true

      # Only the criterion suites are selected: token-counter's `allocations`
      # bench is a plain allocation-accounting binary, so CodSpeed has nothing
      # to measure in it.
      - name: Build the benchmark targets
        working-directory: litellm-rust
        run: >
          cargo codspeed build --locked
          -p litellm-token-counter -p litellm-python-bridge
          --bench token_counter --bench serialization

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          working-directory: litellm-rust
          run: >
            cargo codspeed run
            -p litellm-token-counter -p litellm-python-bridge
            --bench token_counter --bench serialization
